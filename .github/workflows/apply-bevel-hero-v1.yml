name: Apply beveled hero shape

on:
  push:
    paths:
      - '.github/bevel-hero-trigger-v2'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change soft-pink hero shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          text = re.sub(
              r'\n\s*/\* soft-pink beveled hero shape v\d+ \*/.*?(?=\n\s*</style>)',
              '',
              text,
              count=1,
              flags=re.S,
          )

          css = r'''

          /* soft-pink beveled hero shape v2 */
          body.theme-soft-pink .hero-frame .hero{
            clip-path:polygon(
              3.2% 0,
              96.8% 0,
              100% 6.5%,
              100% 93.5%,
              96.8% 100%,
              3.2% 100%,
              0 93.5%,
              0 6.5%
            ) !important;
            -webkit-clip-path:polygon(
              3.2% 0,
              96.8% 0,
              100% 6.5%,
              100% 93.5%,
              96.8% 100%,
              3.2% 100%,
              0 93.5%,
              0 6.5%
            ) !important;
          }
          '''

          text = text.replace('</style>', css + '\n</style>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Change soft-pink hero to beveled corners"
          git push