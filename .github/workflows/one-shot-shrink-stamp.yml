name: One-shot shrink counter stamp

on:
  push:
    paths:
      - '.github/shrink-stamp-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten stamp from bottom only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:0;
            left:7%;
            width:86%;
            height:32%;'''
          new = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:0;
            left:7%;
            width:86%;
            height:27%;'''
          if old not in text:
              raise SystemExit('Expected stamp dimensions not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/shrink-stamp-trigger
          rm -f .github/workflows/one-shot-shrink-stamp.yml

      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/shrink-stamp-trigger .github/workflows/one-shot-shrink-stamp.yml
          git commit -m "Shorten counter stamp further"
          git push
