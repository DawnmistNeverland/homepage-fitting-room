name: Set stamp height to 30 percent

on:
  push:
    paths:
      - '.github/set-stamp-height-30.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the unique counter stamp height
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:0;
            left:7%;
            width:86%;
            height:24%;'''
          new = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:0;
            left:7%;
            width:86%;
            height:30%;'''

          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one 24 percent stamp rule, got {text.count(old)}')
          if text.count('body.theme-soft-pink .counter-stamp-slot{') != 1:
              raise SystemExit('counter stamp selector is not unique')
          if text.count('min-height:0 !important;') != 1:
              raise SystemExit('min-height override is not unique')
          if 'primary-widget-top m' in text:
              raise SystemExit('old capsule DOM unexpectedly exists')

          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit the change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Set counter stamp height to 30 percent"
          git push
