name: Move counter stamp slightly down

on:
  push:
    paths:
      - '.github/move-stamp-down.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move stamp down
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:0;
            left:7%;
            width:86%;
            height:40%;'''
          new = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:3%;
            left:7%;
            width:86%;
            height:40%;'''

          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one current stamp rule, got {text.count(old)}')
          if text.count('body.theme-soft-pink .counter-stamp-slot{') != 1:
              raise SystemExit('counter stamp selector is not unique')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Move counter stamp slightly downward"
          git push
