name: Direct top group patch

on:
  push:
    paths:
      - '.github/direct-top-group-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch index through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.request

          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}/contents/index.html'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'homepage-fitting-room-patcher',
          }

          req = urllib.request.Request(api + '?ref=main', headers=headers)
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)

          text = base64.b64decode(payload['content']).decode('utf-8')
          current_sha = payload['sha']

          stamp_pattern = re.compile(
              r'(body\.theme-soft-pink \.counter-stamp-slot\{\s*position:absolute;\s*)top:(?:0|3)%;',
              re.S,
          )
          text, stamp_count = stamp_pattern.subn(r'\1top:0%;', text, count=1)
          if stamp_count != 1:
              raise SystemExit(f'expected one counter stamp top rule, got {stamp_count}')

          text = re.sub(
              r'\n\s*/\* soft-pink top title and hero shift v\d+ \*/.*?(?=\n\s*</style>)',
              '',
              text,
              count=1,
              flags=re.S,
          )

          css = '''

/* soft-pink top title and hero shift v1 */
body.theme-soft-pink .hero-script-title,
body.theme-soft-pink .top-area > .component-grid{
  transform:translateY(8px);
}
'''
          text = text.replace('</style>', css + '\n</style>', 1)

          if text.count('soft-pink top title and hero shift v1') != 1:
              raise SystemExit('top shift rule is not unique')
          if text.count('body.theme-soft-pink .counter-stamp-slot{') != 1:
              raise SystemExit('counter stamp selector is not unique')

          body = json.dumps({
              'message': 'Move soft-pink title and hero slightly downward',
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'sha': current_sha,
              'branch': 'main',
          }).encode('utf-8')
          put = urllib.request.Request(api, data=body, headers=headers, method='PUT')
          with urllib.request.urlopen(put) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
