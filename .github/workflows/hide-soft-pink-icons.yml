name: Apply soft-pink icon cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-soft-pink-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide labeled icon row in soft-pink theme
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          rule = '''\n  body.theme-soft-pink .row.apps{\n    display:none;\n  }\n'''
          if 'body.theme-soft-pink .row.apps' not in text:
              anchor = '  /* 花间晨雾主题：背景图直接外链项目根目录的 IMG_flower.JPG */\n'
              if anchor not in text:
                  raise SystemExit('anchor not found')
              text = text.replace(anchor, rule + '\n' + anchor, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide labeled app icons in soft-pink theme"
          git push
