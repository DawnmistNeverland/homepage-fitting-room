name: Fix counter stamp min height

on:
  push:
    paths:
      - '.github/fix-counter-min-height-v1.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove inherited minimum height and shorten stamp
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          slot_old = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:0;
            left:7%;
            width:86%;
            height:27%;'''
          slot_new = '''body.theme-soft-pink .counter-stamp-slot{
            position:absolute;
            top:0;
            left:7%;
            width:86%;
            height:24%;'''
          if text.count(slot_old) != 1:
              raise SystemExit(f'expected one current slot block, got {text.count(slot_old)}')
          text = text.replace(slot_old, slot_new, 1)

          stage_old = '''body.theme-soft-pink .counter-stamp-slot .hero-counter-stage{
            display:flex !important;
            width:100%;
            height:100%;
            margin:0;'''
          stage_new = '''body.theme-soft-pink .counter-stamp-slot .hero-counter-stage{
            display:flex !important;
            width:100%;
            height:100%;
            min-height:0 !important;
            margin:0;'''
          if text.count(stage_old) != 1:
              raise SystemExit(f'expected one current stage block, got {text.count(stage_old)}')
          text = text.replace(stage_old, stage_new, 1)

          if text.count('body.theme-soft-pink .counter-stamp-slot{') != 1:
              raise SystemExit('duplicate counter-stamp-slot rules remain')
          if text.count('min-height:0 !important;') != 1:
              raise SystemExit('counter min-height override is not unique')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit clean fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix stamp inherited min-height and shorten it"
          git push
