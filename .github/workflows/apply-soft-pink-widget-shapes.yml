name: Apply soft pink widget shapes

on:
  push:
    paths:
      - '.github/widget-style-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch soft pink widgets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old = '''              <div class="box side-widget primary-widget-top m" data-name="中组件"></div>
              <div class="box side-widget alt primary-widget-bottom m" data-name="中组件"></div>'''

          new = '''              <div class="box side-widget primary-widget-top m" data-name="中组件" data-widget-rev="capsule-rect-v3">
                <div class="soft-capsule-inner">
                  <span class="soft-capsule-g">G</span>
                  <i class="soft-bubble soft-bubble-a"></i>
                  <i class="soft-bubble soft-bubble-b"></i>
                  <i class="soft-bubble soft-bubble-c"></i>
                </div>
              </div>
              <div class="box side-widget alt primary-widget-bottom m" data-name="中组件" data-widget-rev="capsule-rect-v3">
                <div class="soft-rect-inner">
                  <span class="soft-percent">59%</span>
                  <span class="soft-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
                  <i class="soft-bubble soft-bubble-d"></i>
                  <i class="soft-bubble soft-bubble-e"></i>
                </div>
              </div>'''

          if old not in text:
              raise SystemExit('Expected horizontal-widget markup not found')

          text = text.replace(old, new, 1)

          marker = '/* soft-pink widget hard override v3 */'
          css = r'''

          /* soft-pink widget hard override v3 */
          body.theme-soft-pink .primary-widget-top::before,
          body.theme-soft-pink .primary-widget-top::after,
          body.theme-soft-pink .primary-widget-bottom::before,
          body.theme-soft-pink .primary-widget-bottom::after{
            content:none !important;
            display:none !important;
          }

          body.theme-soft-pink .primary-widget-top{
            height:34% !important;
            top:0 !important;
            border-radius:999px !important;
            background:rgba(255,255,255,.14) !important;
            border:1px solid rgba(255,255,255,.62) !important;
            box-shadow:0 9px 24px rgba(98,111,83,.10) !important;
            overflow:hidden !important;
          }

          body.theme-soft-pink .primary-widget-bottom{
            height:54% !important;
            bottom:0 !important;
            margin-top:0 !important;
            border-radius:clamp(18px,3.8vw,24px) !important;
            background:linear-gradient(142deg,rgba(255,255,255,.18) 0 53%,rgba(127,166,91,.64) 53.5% 100%) !important;
            border:1px solid rgba(255,255,255,.58) !important;
            box-shadow:0 10px 26px rgba(98,111,83,.12) !important;
            overflow:hidden !important;
          }

          body.theme-soft-pink .soft-capsule-inner,
          body.theme-soft-pink .soft-rect-inner{
            position:absolute;
            inset:0;
          }

          body.theme-soft-pink .soft-capsule-g{
            position:absolute;
            left:clamp(22px,4vw,30px);
            top:50%;
            transform:translateY(-51%);
            color:#B7C59B;
            font-size:clamp(40px,7vw,56px);
            font-weight:700;
            line-height:1;
            letter-spacing:-.05em;
          }

          body.theme-soft-pink .soft-percent{
            position:absolute;
            left:clamp(18px,3vw,24px);
            bottom:clamp(13px,2.5vw,18px);
            color:#fff;
            font-size:clamp(38px,7vw,56px);
            font-weight:300;
            line-height:.9;
            letter-spacing:-.05em;
          }

          body.theme-soft-pink .soft-bars{
            position:absolute;
            right:clamp(14px,2.8vw,22px);
            bottom:clamp(14px,2.4vw,18px);
            display:flex;
            align-items:flex-end;
            gap:clamp(5px,1vw,8px);
          }

          body.theme-soft-pink .soft-bars i{
            display:block;
            width:clamp(8px,1.7vw,12px);
            background:#fff;
            border-radius:1px;
          }

          body.theme-soft-pink .soft-bars i:nth-child(1){height:16px}
          body.theme-soft-pink .soft-bars i:nth-child(2){height:26px}
          body.theme-soft-pink .soft-bars i:nth-child(3){height:23px}
          body.theme-soft-pink .soft-bars i:nth-child(4){height:42px}
          body.theme-soft-pink .soft-bars i:nth-child(5){height:38px}

          body.theme-soft-pink .soft-bubble{
            position:absolute;
            display:block;
            border:1px solid rgba(177,169,176,.38);
            border-radius:50%;
            background:rgba(255,255,255,.10);
          }

          body.theme-soft-pink .soft-bubble-a{width:12px;height:12px;left:48%;top:25%}
          body.theme-soft-pink .soft-bubble-b{width:9px;height:9px;left:18px;bottom:12px}
          body.theme-soft-pink .soft-bubble-c{width:9px;height:9px;right:20px;top:12px}
          body.theme-soft-pink .soft-bubble-d{width:10px;height:10px;left:17px;top:14px}
          body.theme-soft-pink .soft-bubble-e{width:9px;height:9px;right:82px;top:20px}
          '''

          if marker not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make soft pink widgets visibly capsule and rectangle"
          git push
