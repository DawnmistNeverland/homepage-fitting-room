<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>首页试衣间 · 粉色主题</title>
</head>
<body>
<script>
(async () => {
  const response = await fetch('./index.html?pink-rev=4', { cache: 'no-store' });
  let html = await response.text();

  const oldWidgets = `              <div class="box side-widget primary-widget-top m" data-name="中组件"></div>
              <div class="box side-widget alt primary-widget-bottom m" data-name="中组件"></div>`;

  const newWidgets = `              <div class="box side-widget primary-widget-top m" data-name="中组件" data-widget-rev="capsule-rect-v4">
                <div class="soft-capsule-inner">
                  <span class="soft-capsule-g">G</span>
                  <i class="soft-bubble soft-bubble-a"></i>
                  <i class="soft-bubble soft-bubble-b"></i>
                  <i class="soft-bubble soft-bubble-c"></i>
                </div>
              </div>
              <div class="box side-widget alt primary-widget-bottom m" data-name="中组件" data-widget-rev="capsule-rect-v4">
                <div class="soft-rect-inner">
                  <span class="soft-percent">59%</span>
                  <span class="soft-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
                  <i class="soft-bubble soft-bubble-d"></i>
                  <i class="soft-bubble soft-bubble-e"></i>
                </div>
              </div>`;

  const css = `
  /* pink fitting-room hard override v4 */
  body.theme-soft-pink .row.apps{display:none!important}

  body.theme-soft-pink .primary-widget-top::before,
  body.theme-soft-pink .primary-widget-top::after,
  body.theme-soft-pink .primary-widget-bottom::before,
  body.theme-soft-pink .primary-widget-bottom::after{
    content:none!important;
    display:none!important;
  }

  body.theme-soft-pink .primary-widget-top{
    top:0!important;
    height:34%!important;
    margin:0!important;
    border-radius:999px!important;
    border:1px solid rgba(255,255,255,.68)!important;
    background:rgba(255,255,255,.18)!important;
    box-shadow:0 9px 24px rgba(98,111,83,.11)!important;
    overflow:hidden!important;
  }

  body.theme-soft-pink .primary-widget-bottom{
    bottom:0!important;
    height:54%!important;
    margin:0!important;
    border-radius:clamp(17px,3.6vw,23px)!important;
    border:1px solid rgba(255,255,255,.62)!important;
    background:linear-gradient(142deg,rgba(255,255,255,.20) 0 52%,rgba(124,164,87,.72) 52.5% 100%)!important;
    box-shadow:0 10px 26px rgba(98,111,83,.13)!important;
    overflow:hidden!important;
  }

  body.theme-soft-pink .soft-capsule-inner,
  body.theme-soft-pink .soft-rect-inner{position:absolute;inset:0}

  body.theme-soft-pink .soft-capsule-g{
    position:absolute;left:clamp(21px,4vw,29px);top:50%;transform:translateY(-51%);
    color:#AFBF92;font-size:clamp(39px,7vw,55px);font-weight:700;line-height:1;letter-spacing:-.05em
  }

  body.theme-soft-pink .soft-percent{
    position:absolute;left:clamp(17px,3vw,23px);bottom:clamp(12px,2.3vw,17px);
    color:#fff;font-size:clamp(37px,6.8vw,54px);font-weight:300;line-height:.9;letter-spacing:-.05em
  }

  body.theme-soft-pink .soft-bars{
    position:absolute;right:clamp(13px,2.6vw,21px);bottom:clamp(13px,2.3vw,17px);
    display:flex;align-items:flex-end;gap:clamp(5px,1vw,8px)
  }
  body.theme-soft-pink .soft-bars i{display:block;width:clamp(8px,1.6vw,12px);background:#fff;border-radius:1px}
  body.theme-soft-pink .soft-bars i:nth-child(1){height:15px}
  body.theme-soft-pink .soft-bars i:nth-child(2){height:25px}
  body.theme-soft-pink .soft-bars i:nth-child(3){height:22px}
  body.theme-soft-pink .soft-bars i:nth-child(4){height:41px}
  body.theme-soft-pink .soft-bars i:nth-child(5){height:37px}

  body.theme-soft-pink .soft-bubble{
    position:absolute;display:block;border:1px solid rgba(177,169,176,.38);
    border-radius:50%;background:rgba(255,255,255,.10)
  }
  body.theme-soft-pink .soft-bubble-a{width:12px;height:12px;left:48%;top:25%}
  body.theme-soft-pink .soft-bubble-b{width:9px;height:9px;left:18px;bottom:12px}
  body.theme-soft-pink .soft-bubble-c{width:9px;height:9px;right:20px;top:12px}
  body.theme-soft-pink .soft-bubble-d{width:10px;height:10px;left:17px;top:14px}
  body.theme-soft-pink .soft-bubble-e{width:9px;height:9px;right:82px;top:20px}
  `;

  html = html.replace(oldWidgets, newWidgets);
  html = html.replace('</style>', css + '\n</style>');
  html = html.replace('<body>', '<body data-preview-rev="capsule-rect-v4">');

  document.open();
  document.write(html);
  document.close();
})().catch((error) => {
  document.body.textContent = '预览加载失败：' + error.message;
});
</script>
</body>
</html>
